# Project, container and volume names. Set in .env, never derived: changing it
# would leave the database volume behind.
name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env}

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    # Node as PID 1 ignores SIGTERM; tini forwards it so `docker stop` is
    # instant.
    init: true
    restart: unless-stopped
    mem_limit: 500m
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Inside the network the DB is reachable by service name, so the host-side
      # DATABASE_URL from .env (used by the Prisma CLI in dev) is overridden
      # here.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy

  # One-off, run by `make deploy`. The builder stage carries the Prisma CLI,
  # which the api image deliberately doesn't.
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: builder
    profiles:
      - tools
    command: ['npx', 'prisma', 'migrate', 'deploy']
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy

  # The nightly off-site backup. Behind a profile so only the server runs it:
  # its .env sets COMPOSE_PROFILES=backup.
  backup:
    build: ./backup
    profiles:
      - backup
    init: true
    restart: unless-stopped
    mem_limit: 100m
    env_file:
      - .env
    environment:
      - PGHOST=db
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 300m
    env_file:
      - .env
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db_data:
